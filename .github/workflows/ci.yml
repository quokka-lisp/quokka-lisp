name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # CLAUDE.md rule 2: every change must build and pass tests for native and wasm32.
  native:
    name: Native (build, test, fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace

  book:
    name: Book structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-book.sh

  docs:
    name: Rustdoc (no broken links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  gc-torture:
    name: GC torture (collect at every mutation, then verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p quokka-vm -p quokka-bootstrap --features quokka-vm/gc-torture

  wasm-browser:
    name: wasm32-unknown-unknown (browser build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # quokka is a native host and is deliberately excluded.
      - run: cargo build -p quokka-vm -p quokka-wasm --target wasm32-unknown-unknown

  wasm-wasi:
    name: wasm32-wasip1 (tests under wasmtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      # One step, not two. `cargo test -p` builds and runs every test target
      # in the package, so this already runs tests/differential.rs — which a
      # second step naming `--test differential` then ran again, for twenty
      # seconds, looking like extra coverage.
      #
      # It is still the portability half of the differential tests: the same
      # Lisp files and the same baselines, on a 32-bit target with a
      # different pointer story. The correctness half is the sbcl-oracle job.
      #
      # Cargo runs each test in its crate's directory, which `--dir=.` is; the
      # tests that read tests/lisp reach it by an absolute path built from
      # CARGO_MANIFEST_DIR, which WASI resolves only inside a preopened
      # directory — so the repository is preopened too, under its own path.
      # Without it, `read_dir` of tests/lisp failed and the job had been red
      # since 22 Nov.
      - name: VM, bootstrap and differential tests under wasmtime
        run: |
          CARGO_TARGET_WASM32_WASIP1_RUNNER="wasmtime --dir=. --dir=$GITHUB_WORKSPACE" \
            cargo test -p quokka-vm -p quokka-bootstrap --target wasm32-wasip1

  # SBCL is the differential-test oracle, never a build dependency. This job
  # is the only place it is installed, and nothing else needs it.
  sbcl-oracle:
    name: SBCL oracle (differential tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sbcl
      - run: sbcl --version
      - name: Every test file is listed and has a baseline
        run: ./scripts/check-differential.sh
      - name: SBCL must agree with the baselines
        run: ./scripts/oracle.sh

  # ansi-test, the Common Lisp conformance suite (#60), fetched at the commit
  # scripts/ansi-test.sh pins. Its own job because it takes minutes and needs
  # the network (decision 5). It enforces the ratchet: a test listed in
  # tests/ansi/baseline.txt that no longer passes fails the build.
  ansi-test:
    name: ansi-test (tier 1, ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Run the tier-1 groups
        run: ./scripts/ansi-test.sh
        env:
          ANSI_TEST_REQUIRED: "1"
