name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# What a workflow is trusted with and what it runs are both written down
# (#117). The token can read the repository and nothing else. Every action is
# named by the commit it is, with its tag beside it for a person: a tag can
# be moved by whoever holds the action's repository, a commit cannot. Cargo
# builds what Cargo.lock says (`--locked`), with the compiler
# rust-toolchain.toml names, against the SBCL scripts/sbcl.pin names and the
# wasmtime named below — so that `main` turns red when a commit breaks it and
# for no other reason. To move any of them is a commit like any other.
permissions:
  contents: read

# A newer push to a pull request makes the older run pointless; on main every
# commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # CLAUDE.md rule 2: every change must build and pass tests for native and wasm32.
  native:
    name: Native (build, test, fmt, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace

  # The checks that are scripts rather than cargo's. `check.sh` has always
  # run them; CI ran only the differential one, inside the oracle job, so a
  # library file missing from boot.rs, or a `#[test]` outside the two test
  # directories, passed here while the docs said each "fails the build"
  # (#116).
  checks:
    name: Scripts (test placement, file lists)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/check-test-placement.sh
      - run: ./scripts/check-compiler.sh
      - run: ./scripts/check-differential.sh

  # Cargo.toml says which Rust is the oldest that builds Quokka. A claim
  # nothing builds is a guess, so this builds it: the machine, the cold
  # build and the program, with exactly that compiler (#116). The browser
  # crate is left out — its one dependency sets its own floor.
  msrv:
    name: Oldest supported Rust (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --locked -p quokka-vm -p quokka-bootstrap -p quokka

  # Rule 8: MIT, and nothing that is not compatible with it. deny.toml lists
  # the licences a dependency may carry; this also refuses a dependency from
  # anywhere but crates.io and reports published security advisories (#117).
  licences:
    name: Licences and advisories (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2

  book:
    name: Book structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/check-book.sh

  docs:
    name: Rustdoc (no broken links)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # **The two heavy jobs run on request, not on every push** (Carsten, 25 Nov
  # 2026). GC torture and the tests under wasmtime each run the whole suite
  # again, slowly — one collects and verifies the heap after every slice, the
  # other has one thread — and between them were twelve to eighteen minutes
  # of a run whose other jobs finish in under five. Neither asks "is this
  # still Common Lisp?", which is what CI is for here; they ask whether the
  # machine is sound, and `./scripts/check.sh` asks that on the developer's
  # machine before every commit. They stay here for the "Run workflow"
  # button, so that they can be run on these machines when wanted.
  #
  # What every push still does on wasm32: both targets are built, and a world
  # runs in a JavaScript engine and in a headless browser (wasm-browser).
  gc-torture:
    name: GC torture (collect at every mutation, then verify)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked -p quokka-vm -p quokka-bootstrap --features quokka-vm/gc-torture

  wasm-browser:
    name: wasm32-unknown-unknown (browser build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # quokka is a native host and is deliberately excluded.
      - run: cargo build --locked -p quokka-vm -p quokka-wasm --target wasm32-unknown-unknown
      # The other wasm target's tests are built, though run only on request
      # (see gc-torture): a change that does not compile for WASI is caught
      # here for the price of a build.
      - run: cargo test --locked --no-run -p quokka-vm -p quokka-bootstrap --target wasm32-wasip1
      # And then as the page gets it: bundled by wasm-pack, loaded by a
      # JavaScript engine, given a world, and asked a question (#116). Until
      # this step nothing in CI produced the bundle index.html imports, let
      # alone called it. Node runs the same engine a Chromium browser does;
      # what it has no part of is the page itself — the DOM, `fetch`, the
      # timer between slices — which the step after it covers.
      - name: Bundle the dev console
        run: |
          cargo install wasm-pack --locked --version 0.15.1
          wasm-pack build crates/quokka-wasm --target web --out-dir www/pkg
      - name: A world answers in a JavaScript engine
        run: |
          cargo run --locked --release -p quokka -- build crates/quokka-wasm/www/world.qi
          node scripts/smoke-wasm.mjs
      # And the page itself, in the runner's Chrome with no window: it
      # fetches the world, runs a form in slices between which the browser
      # has the thread, and the answer is found in the document.
      - name: The page answers in a headless browser
        run: ./scripts/smoke-browser.sh
        env:
          SMOKE_BROWSER_REQUIRED: "1"

  wasm-wasi:
    name: wasm32-wasip1 (tests under wasmtime)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: "49.0.7"
      # One step, not two. `cargo test -p` builds and runs every test target
      # in the package, so this already runs tests/differential.rs — which a
      # second step naming `--test differential` then ran again, for twenty
      # seconds, looking like extra coverage.
      #
      # It is still the portability half of the differential tests: the same
      # Lisp files and the same baselines, on a 32-bit target with a
      # different pointer story. The correctness half is the sbcl-oracle job.
      #
      # Cargo runs each test in its crate's directory, which `--dir=.` is; the
      # tests that read tests/lisp reach it by an absolute path built from
      # CARGO_MANIFEST_DIR, which WASI resolves only inside a preopened
      # directory — so the repository is preopened too, under its own path.
      # Without it, `read_dir` of tests/lisp failed and the job had been red
      # since 22 Nov.
      # A browser loads a world that a 64-bit machine built (#84), so the
      # 32-bit tests are handed one: built natively here, and required, so
      # that `an_image_built_elsewhere_runs_here` cannot pass on nothing.
      - name: Build a world natively
        run: cargo run --locked --release -p quokka -- build target/native-world.qi
      - name: VM, bootstrap and differential tests under wasmtime
        run: |
          CARGO_TARGET_WASM32_WASIP1_RUNNER="wasmtime --dir=. --dir=$GITHUB_WORKSPACE --env QUOKKA_FOREIGN_IMAGE=$GITHUB_WORKSPACE/target/native-world.qi --env QUOKKA_FOREIGN_IMAGE_REQUIRED=1" \
            cargo test --locked -p quokka-vm -p quokka-bootstrap --target wasm32-wasip1

  # SBCL is the differential-test oracle, never a build dependency. This job
  # is the only place it is installed, and nothing else needs it.
  sbcl-oracle:
    name: SBCL oracle (differential tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The oracle is pinned (#117): the baselines are one SBCL's answers, so
      # CI runs that SBCL and no other. scripts/sbcl.pin names the version
      # and the commit its tag points at. No distribution packages an exact
      # version, so it is built from source — SBCL is written in Lisp and
      # needs a Lisp to build it, which is all apt's older SBCL is used for —
      # and the result is cached under the pin, so a build (about five
      # minutes) happens once per pin.
      - name: Read the pin
        run: grep -E '^SBCL_(VERSION|COMMIT)=' scripts/sbcl.pin >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: sbcl
        with:
          path: ~/sbcl
          key: sbcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/sbcl.pin') }}
      - name: Build the pinned SBCL
        if: steps.sbcl.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y sbcl
          git clone --quiet --depth 1 --branch "sbcl-$SBCL_VERSION" \
            https://github.com/sbcl/sbcl "$RUNNER_TEMP/sbcl"
          cd "$RUNNER_TEMP/sbcl"
          # A tag can be moved; the commit cannot.
          test "$(git rev-parse HEAD)" = "$SBCL_COMMIT"
          # A git checkout names itself after its branch ("2.6.10.HEAD.1-…").
          # A release tarball carries its version in this file and no .git,
          # so make the checkout into one: the same source, the release's name.
          echo "\"$SBCL_VERSION\"" > version.lisp-expr
          rm -rf .git
          sh make.sh --prefix="$HOME/sbcl"
          sh install.sh
      - run: echo "$HOME/sbcl/bin" >> "$GITHUB_PATH"
      - name: The oracle is the pinned one
        run: |
          sbcl --version
          test "$(sbcl --version)" = "SBCL $SBCL_VERSION"
      - name: Every test file is listed and has a baseline
        run: ./scripts/check-differential.sh
      - name: SBCL must agree with the baselines
        run: ./scripts/oracle.sh

  # ansi-test, the Common Lisp conformance suite (#60), fetched at the commit
  # scripts/ansi-test.sh pins. Its own job because it takes minutes and needs
  # the network (decision 5). It enforces the ratchet: a test listed in
  # tests/ansi/baseline.txt that no longer passes fails the build.
  ansi-test:
    name: ansi-test (tier 1, ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run the tier-1 groups
        run: ./scripts/ansi-test.sh
        env:
          ANSI_TEST_REQUIRED: "1"
