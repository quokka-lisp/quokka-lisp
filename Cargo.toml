[workspace]
resolver = "2"
members = [
    "crates/quokka-vm",
    "crates/quokka-bootstrap",
    "crates/quokka",
    "crates/quokka-wasm",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/quokka-lisp/quokka-lisp"
authors = ["The Quokka authors"]

# Lints for every crate, in one place (#118): each crate's Cargo.toml says
# `lints.workspace = true`. Two crates had these as attributes and two had
# none.
#
# `unsafe_code` is *forbidden*, which no attribute below can override. The
# comment further down gives "there is no `unsafe` in the workspace" as the
# reason tests may run optimised; this is what keeps it true. If `unsafe` is
# ever needed — mapping an image into memory is the likely first case — it
# arrives by changing this line to `deny` and allowing it at the one place,
# with the reason rule 7 asks for.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.dependencies]
quokka-vm = { path = "crates/quokka-vm" }
quokka-bootstrap = { path = "crates/quokka-bootstrap" }

[profile.release]
# Keep the wasm payload small; the VM is meant to be comprehensible, not fast yet.
opt-level = "s"
lto = true
codegen-units = 1
# No panic = "abort": it breaks `cargo test --release`, and the size win is small.

# Tests run optimised, and they are the only thing that does.
#
# CI spent its time *running* tests rather than compiling them: `cargo test
# --workspace` took 128 seconds against 14 to build it, and the wasip1 job
# took 281. The reason is what this project is — an interpreter running a
# six-hundred-line prelude, sixty-seven times in `boot.rs` alone, in a debug
# build where every tagged-word accessor is a real function call.
#
# `quokka-vm` has no dependencies, so compiling it optimised costs well under
# a second and the test run drops about eightfold. There is no `unsafe` in the
# workspace, so optimisation cannot change behaviour; and the assertions that
# would otherwise be lost are turned back on explicitly below rather than left
# to a default. (A compiled program popping an empty stack used to be found
# only by a `debug_assert!`; since #94 that check is a comparison in every
# build.)
#
# `cargo build` and the REPL keep the ordinary dev profile. Only tests pay.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true
