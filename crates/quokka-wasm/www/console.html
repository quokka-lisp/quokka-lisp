<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quokka dev console</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <meta name="theme-color" content="#105C55" />
    <style>
      /* Brand palette — see assets/README.md. */
      :root {
        color-scheme: light dark;
        --bg: #fdf7ec;    /* soft cream  */
        --fg: #4c2311;    /* dark brown  */
        --dim: #8a6a55;
        --rule: #e4d7c3;
        --accent: #105c55; /* teal       */
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #073a39;  /* dark teal   */
          --fg: #fdf7ec;
          --dim: #7fa6a0;
          --rule: #10534f;
          --accent: #a2d9c5; /* mint     */
        }
      }
      body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg);
             font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
      main { max-width: 760px; margin: 0 auto; }
      h1 { font: 600 15px/1.4 system-ui, sans-serif; color: var(--dim); margin: 0 0 16px;
           display: flex; align-items: center; gap: 10px; }
      h1 img { width: 22px; height: 22px; }
      label { color: var(--accent); font-weight: 600; }
      #transcript { white-space: pre-wrap; border-bottom: 1px solid var(--rule); padding-bottom: 12px; min-height: 40vh; }
      form { display: flex; gap: 8px; align-items: baseline; padding-top: 12px; }
      input { flex: 1; font: inherit; color: inherit; background: transparent; border: 0; outline: none; }
      button { font: inherit; color: var(--accent); background: transparent; border: 1px solid var(--rule); border-radius: 4px; padding: 0 8px; }
      button:disabled { color: var(--dim); }
    </style>
  </head>
  <body>
    <main>
      <h1><img src="favicon-32x32.png" alt="" />Quokka dev console</h1>
      <div id="transcript"></div>
      <form id="form">
        <label for="input">quokka&gt;</label>
        <input id="input" autocomplete="off" autofocus />
        <button type="button" id="stop" disabled>Stop</button>
        <button type="button" id="save">Save world</button>
      </form>
    </main>
    <script type="module">
      // The page is a host, in the sense of crates/quokka-vm/src/host.rs: it
      // owns the clock and the screen, and the world owns neither. Three
      // things happen here and nowhere else — fetching the image, deciding
      // how long a slice may run, and putting text on the screen.
      import init, { Quokka } from "./pkg/quokka_wasm.js";

      const transcript = document.getElementById("transcript");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const stop = document.getElementById("stop");
      const save = document.getElementById("save");

      // A text node, never innerHTML: what a program prints is text.
      const print = (text) => {
        if (!text) return;
        transcript.append(document.createTextNode(text));
        window.scrollTo(0, document.body.scrollHeight);
      };

      await init();

      // A world is an image someone built: `quokka build www/world.qi`.
      // The page does not carry the interpreter that builds one.
      let vm;
      try {
        const response = await fetch("./world.qi");
        if (!response.ok) throw new Error(`world.qi: ${response.status}`);
        vm = new Quokka(new Uint8Array(await response.arrayBuffer()));
        print(vm.banner() + "\n");
      } catch (error) {
        print(`; no world: ${error}\n; build one with: cargo run --release -p quokka -- build crates/quokka-wasm/www/world.qi\n`);
        input.disabled = true;
        save.disabled = true;
        throw error;
      }

      // How long a slice may hold the page: about half a frame at 60 Hz.
      const TARGET_MS = 8;
      // The budget is in steps, not milliseconds, so that what a program
      // computes cannot depend on the machine's speed (docs/design.md,
      // "Slices"). The page gets a deadline's responsiveness anyway, by
      // sizing the next slice from how long the last one took.
      let steps = 20000;

      // The world as it was before the line now running: a snapshot, taken
      // while the machine is idle. If the machine itself fails — a trap,
      // which is a bug in Quokka and ends this instance for good — the
      // snapshot is what is left to save, so a failure costs one line and
      // not the session (#88).
      let snapshot = vm.save();
      let failed = false;
      const fail = (error) => {
        failed = true;
        console.error(error);
        print("\n; Quokka's machine failed, which is a bug in Quokka and not in your program.\n" +
              "; The browser's console has the details. This world cannot go on, but\n" +
              "; Save world gives you the world as it was before that line.\n");
        input.disabled = true;
        stop.disabled = true;
      };

      const pump = () => {
        const before = performance.now();
        let more;
        try {
          more = vm.run(steps);
        } catch (error) {
          return fail(error);
        }
        const took = performance.now() - before;
        print(vm.take_output());
        if (more) {
          const scale = Math.min(2, Math.max(0.5, TARGET_MS / Math.max(took, 0.1)));
          steps = Math.min(5_000_000, Math.max(1000, Math.round(steps * scale)));
          // A timer, so the browser paints and takes input between slices.
          setTimeout(pump, 0);
        } else {
          snapshot = vm.save();
          stop.disabled = true;
          input.disabled = false;
          input.focus();
        }
      };

      const evaluate = (line) => {
        print("quokka> " + line + "\n");
        vm.submit(line);
        input.disabled = true;
        stop.disabled = false;
        pump();
      };

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (vm.busy()) return;
        const line = input.value;
        input.value = "";
        evaluate(line);
      });

      // A form after `#` in the address is evaluated once the world is up:
      // index.html#(+ 1 2). A link can carry an example, and it is how CI
      // drives the page in a headless browser, which has no keyboard.
      if (location.hash.length > 1) {
        // An address with a stray % in it is not a form: the page must
        // still reach the lines below, which make Stop and Save work.
        try {
          evaluate(decodeURIComponent(location.hash.slice(1)));
        } catch (error) {
          console.error("the address is not a form", error);
        }
      }

      // The line may never end; the page is never stuck waiting for it.
      stop.addEventListener("click", () => vm.interrupt());

      // The whole world as a file — load it again by serving it as world.qi.
      save.addEventListener("click", () => {
        // After a failure the snapshot is all there is. Otherwise the world
        // as it stands, in the middle of a computation included.
        const bytes = failed ? snapshot : vm.save();
        const url = URL.createObjectURL(new Blob([bytes], { type: "application/octet-stream" }));
        const link = Object.assign(document.createElement("a"), { href: url, download: "world.qi" });
        link.click();
        URL.revokeObjectURL(url);
      });
    </script>
  </body>
</html>
