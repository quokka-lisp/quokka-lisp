<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quokka</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <meta name="theme-color" content="#105C55" />
    <style>
      /* The theme: what each ink and text style the world names looks like
         (docs/display.md, decision 3). The world never sends CSS; it sends
         names, and these rules give them colours, light and dark. Brand
         palette: assets/README.md. */
      :root {
        color-scheme: light dark;
        --page: #fdf7ec;      /* soft cream */
        --surface: #fffdf8;
        --rule: #e8dcc8;
        --ink: #4c2311;       /* dark brown */
        --dim: #8a6a55;
        --accent: #105c55;    /* teal */
        --error: #a32d2d;
        --success: #3b6d11;
        --warning: #854f0b;
        --coral: #c8553d; --amber: #c98a12; --teal: #105c55;
        --blue: #2c6aa0; --purple: #6b4ea0; --pink: #b04a7a;
        --editor: #f6eedf;
        --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #073a39;    /* dark teal */
          --surface: #0a4543;
          --rule: #10534f;
          --ink: #fdf7ec;
          --dim: #7fa6a0;
          --accent: #a2d9c5;  /* mint */
          --error: #f09595;
          --success: #97c459;
          --warning: #fac775;
          --coral: #f0997b; --amber: #f2c26b; --teal: #a2d9c5;
          --blue: #85b7eb; --purple: #b9a2e8; --pink: #ed93b1;
          --editor: #0e4e4b;
        }
      }
      html, body { height: 100%; margin: 0; }
      body { background: var(--page); color: var(--ink); font: 14px/1.5 var(--font-sans);
             display: flex; flex-direction: column; }
      #bar { display: flex; align-items: center; gap: 10px; padding: 6px 12px;
             border-bottom: 1px solid var(--rule); font-weight: 600; color: var(--dim); }
      #bar img { width: 20px; height: 20px; }
      #bar .space { flex: 1; }
      #status { font-weight: 400; font-size: 12px; }
      button { font: inherit; font-weight: 400; color: var(--accent); background: transparent;
               border: 1px solid var(--rule); border-radius: 4px; padding: 0 8px; }
      button:disabled { color: var(--dim); }
      #surface { flex: 1; min-height: 0; display: flex; padding: 8px; gap: 8px; }
      #surface > * { flex: 1; }
      #console { white-space: pre-wrap; font: 12px/1.4 var(--font-mono); color: var(--dim);
                 max-height: 20vh; overflow: auto; padding: 0 12px; }
      #console:empty { display: none; }

      /* Layout (decision 8): splits are flexible boxes, weights their flex. */
      .q-split { display: flex; gap: 8px; min-width: 0; min-height: 0; }
      .q-split.q-vertical { flex-direction: column; }
      .q-viewer { display: flex; flex-direction: column; min-width: 0; min-height: 0;
                  background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
      .q-viewer > .q-title { padding: 4px 10px; font-size: 12px; color: var(--dim);
                             border-bottom: 1px solid var(--rule); }
      .q-viewer > .q-contents { flex: 1; overflow: auto; padding: 8px 12px; white-space: pre-wrap;
                                overflow-wrap: anywhere; }

      /* Records (decision 3). */
      .q-block { white-space: pre-wrap; }
      .q-layout-row { display: flex; align-items: flex-start; }
      .q-layout-row > .q-block { flex: none; padding-top: 2px; }
      .q-layout-row > .q-editor { flex: 1; }
      .q-editor { display: block; width: 100%; box-sizing: border-box; resize: none; overflow: hidden;
                  font: 14px/1.5 var(--font-mono); color: var(--ink); background: var(--editor);
                  border: 0; border-radius: 4px; padding: 2px 6px; margin: 0; outline: none; }
      .q-editor:focus { box-shadow: 0 0 0 1px var(--accent); }
      .q-editor[readonly] { background: transparent; }
      .q-family-fixed { font-family: var(--font-mono); }
      .q-family-sans { font-family: var(--font-sans); }
      .q-family-serif { font-family: Georgia, serif; }
      .q-face-bold { font-weight: 600; }
      .q-face-italic { font-style: italic; }
      .q-face-bold-italic { font-weight: 600; font-style: italic; }
      .q-size-small { font-size: 12px; }
      .q-size-large { font-size: 17px; }
      .q-size-huge { font-size: 24px; }
      .q-strike { text-decoration: line-through; opacity: 0.6; }
      .q-note { font-size: 12px; color: var(--dim); font-style: italic; }
      .q-bar { display: block; border-left: 2px solid var(--rule); padding-left: 8px; }
      .q-ink-ink { color: var(--ink); }
      .q-ink-dim { color: var(--dim); }
      .q-ink-accent { color: var(--accent); }
      .q-ink-error { color: var(--error); }
      .q-ink-success { color: var(--success); }
      .q-ink-warning { color: var(--warning); }
      .q-ink-coral { color: var(--coral); }
      .q-ink-amber { color: var(--amber); }
      .q-ink-teal { color: var(--teal); }
      .q-ink-blue { color: var(--blue); }
      .q-ink-purple { color: var(--purple); }
      .q-ink-pink { color: var(--pink); }

      /* Drawings (#143): SVG, shapes filled or stroked with an ink. */
      .q-drawing { display: block; }
      .q-drawing-fit { width: 100%; max-height: 60vh; }
      .q-drawing-stretch { width: 100%; height: 100%; }
      .q-stroke-ink, .q-stroke-dim, .q-stroke-accent, .q-stroke-error, .q-stroke-success,
      .q-stroke-warning, .q-stroke-coral, .q-stroke-amber, .q-stroke-teal, .q-stroke-blue,
      .q-stroke-purple, .q-stroke-pink { fill: none; stroke-width: 1; }
      .q-fill-ink { fill: var(--ink); } .q-stroke-ink { stroke: var(--ink); }
      .q-fill-dim { fill: var(--dim); } .q-stroke-dim { stroke: var(--dim); }
      .q-fill-accent { fill: var(--accent); } .q-stroke-accent { stroke: var(--accent); }
      .q-fill-error { fill: var(--error); } .q-stroke-error { stroke: var(--error); }
      .q-fill-success { fill: var(--success); } .q-stroke-success { stroke: var(--success); }
      .q-fill-warning { fill: var(--warning); } .q-stroke-warning { stroke: var(--warning); }
      .q-fill-coral { fill: var(--coral); } .q-stroke-coral { stroke: var(--coral); }
      .q-fill-amber { fill: var(--amber); } .q-stroke-amber { stroke: var(--amber); }
      .q-fill-teal { fill: var(--teal); } .q-stroke-teal { stroke: var(--teal); }
      .q-fill-blue { fill: var(--blue); } .q-stroke-blue { stroke: var(--blue); }
      .q-fill-purple { fill: var(--purple); } .q-stroke-purple { stroke: var(--purple); }
      .q-fill-pink { fill: var(--pink); } .q-stroke-pink { stroke: var(--pink); }
      .q-drawn-text { font-family: var(--font-sans); font-size: 12px; }
      .q-drawn-text.q-stroke-ink { fill: var(--ink); stroke: none; }
    </style>
  </head>
  <body>
    <div id="bar">
      <img src="favicon-32x32.png" alt="" />Quokka
      <span id="status"></span>
      <span class="space"></span>
      <button type="button" id="stop" disabled title="Stop the running form (Cmd-.)">Stop</button>
      <button type="button" id="save">Save world</button>
    </div>
    <div id="surface"></div>
    <div id="console"></div>
    <script type="module">
      // The page is a host (crates/quokka-vm/src/host.rs): it owns the clock
      // and the screen. It fetches the world, starts the environment's
      // command loop, runs slices while the world has work, hands what the
      // world displayed to the renderer, and posts what the person does.
      // The dev console that was here is console.html.
      import init, { Quokka } from "./pkg/quokka_wasm.js";
      import { View } from "./renderer.js";

      const surface = document.getElementById("surface");
      const consoleOut = document.getElementById("console");
      const status = document.getElementById("status");
      const stop = document.getElementById("stop");
      const save = document.getElementById("save");

      await init();

      let vm;
      try {
        const response = await fetch("./world.qi");
        if (!response.ok) throw new Error(`world.qi: ${response.status}`);
        vm = new Quokka(new Uint8Array(await response.arrayBuffer()));
      } catch (error) {
        surface.textContent = `No world: ${error}. Build one with: ` +
          "cargo run --release -p quokka -- build crates/quokka-wasm/www/world.qi";
        throw error;
      }
      status.textContent = vm.banner();

      // How long a slice may hold the page: about half a frame at 60 Hz. The
      // budget is in steps, not milliseconds (docs/design.md, "Slices"), and
      // is sized from how long the last slice took.
      const TARGET_MS = 8;
      let steps = 20000;
      let pumping = false;
      let failed = false;

      const view = new View(surface, (event) => {
        vm.post_event(event);
        pump();
      });
      window.quokka = { vm, view };

      const fail = (error) => {
        failed = true;
        console.error(error);
        consoleOut.textContent += "\nQuokka's machine failed, which is a bug in Quokka and not in " +
          "your program. The browser's console has the details.\n";
        stop.disabled = true;
      };

      // Run slices until the world is idle: waiting for the person.
      function pump() {
        if (pumping || failed) return;
        pumping = true;
        setTimeout(step, 0);
      }

      function step() {
        const before = performance.now();
        let more;
        try {
          more = vm.run(steps);
        } catch (error) {
          pumping = false;
          return fail(error);
        }
        const took = performance.now() - before;
        const messages = vm.take_messages();
        try {
          if (messages) view.apply(messages);
        } catch (error) {
          // Drawing failed, not the world: say so and keep it running.
          console.error("the page could not draw", error);
        }
        const output = vm.take_output();
        // The strip keeps the end of what was written: a thread that
        // prints for ever must not grow the page for ever (#195).
        if (output) consoleOut.textContent = (consoleOut.textContent + output).slice(-20000);
        stop.disabled = !more;
        if (more) {
          const scale = Math.min(2, Math.max(0.5, TARGET_MS / Math.max(took, 0.1)));
          steps = Math.min(5_000_000, Math.max(1000, Math.round(steps * scale)));
          setTimeout(step, 0);
        } else {
          pumping = false;
          idle();
        }
      }

      // Stop a form that will not end: the environment starts again and
      // redraws from its records (docs/display.md, decision 6).
      const interrupt = () => {
        vm.interrupt();
        pump();
      };
      stop.addEventListener("click", interrupt);
      document.addEventListener("keydown", (event) => {
        if (event.metaKey && event.key === ".") {
          event.preventDefault();
          interrupt();
        }
      });

      save.addEventListener("click", () => {
        let bytes;
        try {
          bytes = vm.save();
        } catch (error) {
          // After the machine itself failed the instance cannot be used;
          // the dev console (console.html) keeps a snapshot for this case.
          consoleOut.textContent += "\nThe world cannot be saved after the machine failed.\n";
          return;
        }
        const url = URL.createObjectURL(new Blob([bytes], { type: "application/octet-stream" }));
        const link = Object.assign(document.createElement("a"), { href: url, download: "world.qi" });
        link.click();
        URL.revokeObjectURL(url);
      });

      // A form after `#` in the address is typed into the listener and
      // run, as a person would: index.html#(+ 1 2). How CI drives the page
      // in a headless browser, which has no keyboard.
      let typed = location.hash.length <= 1;
      function idle() {
        if (typed) return;
        const editor = view.model.focus && view.model.focus.dom;
        if (!editor) return;
        typed = true;
        editor.value = decodeURIComponent(location.hash.slice(1));
        editor.dispatchEvent(new Event("input"));
        editor.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", code: "Enter" }));
      }

      try {
        vm.start("%RUN-ENVIRONMENT");
      } catch (error) {
        surface.textContent = `The world has no environment: ${error}`;
        throw error;
      }
      pump();
    </script>
  </body>
