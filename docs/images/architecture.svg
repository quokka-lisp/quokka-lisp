<!-- Drawn for docs/design.md; edit the SVG directly. -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-label="Rust supplies the machine; everything you see is Lisp" font-size="13"><style>
svg { --cds-chart-axis: #9c9a92; --cds-chart-grid: #e2e0d8; --cds-chart-categorical-1: #378add;
  --cds-text-primary: #1f1f1d; --cds-text-secondary: #5f5e5a; --cds-chart-reference-tint: #f6f5f1;
  --cds-surface: #ffffff; --cds-page: #ffffff;
  font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
@media (prefers-color-scheme: dark) {
  svg { --cds-chart-axis: #8a8880; --cds-chart-grid: #353533; --cds-chart-categorical-1: #85b7eb;
    --cds-text-primary: #ecebe6; --cds-text-secondary: #b4b2a9; --cds-chart-reference-tint: #1c1c1b;
    --cds-surface: #222221; --cds-page: #161615; }
}
</style><rect width="760" height="500" rx="12" fill="var(--cds-page)"/><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Rust supplies the machine; everything you see is Lisp</text><g><rect x="24" y="56" width="712" height="220" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.08" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="40" y="78" font-weight="600" fill="var(--cds-text-primary)">In the image — Lisp, live and editable while it runs</text></g><g><rect x="40" y="88" width="680" height="52" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="56" y="110" font-weight="600" fill="var(--cds-text-primary)">Environment</text><text x="56" y="128" font-size="11.5" fill="var(--cds-text-secondary)">Tiled viewers, live text, listener, inspector, browser, debugger</text></g><g><rect x="40" y="148" width="680" height="52" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="56" y="170" font-weight="600" fill="var(--cds-text-primary)">Presentation and UI toolkit</text><text x="56" y="188" font-size="11.5" fill="var(--cds-text-secondary)">Presentation types, commands, layout, incremental redisplay, input</text></g><g><rect x="40" y="208" width="680" height="52" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="56" y="230" font-weight="600" fill="var(--cds-text-primary)">Language and runtime library</text><text x="56" y="248" font-size="11.5" fill="var(--cds-text-secondary)">Compiler, conditions and restarts, generic functions, streams, packages</text></g><g><path d="M380 278V314" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-start="url(#arch-arrow)" marker-end="url(#arch-arrow)"></path><text x="396" y="300" font-size="11.5" fill="var(--cds-text-secondary)">Primitive table: the only door between Lisp and Rust</text></g><g><rect x="24" y="316" width="712" height="160" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="338" font-weight="600" fill="var(--cds-text-primary)">The host program — Rust, small and rarely changed</text></g><g><rect x="40" y="348" width="680" height="52" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="56" y="370" font-weight="600" fill="var(--cds-text-primary)">VM core</text><text x="56" y="388" font-size="11.5" fill="var(--cds-text-secondary)">Bytecode interpreter, tagged heap, garbage collector, image save and load, processes</text></g><g><rect x="40" y="408" width="680" height="52" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="56" y="430" font-weight="600" fill="var(--cds-text-primary)">Host layer</text><text x="56" y="448" font-size="11.5" fill="var(--cds-text-secondary)">Display protocol renderer (DOM and canvas), sound player (Web Audio), browser storage, network, clock; Tauri shell</text></g></svg>
