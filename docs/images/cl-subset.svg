</style><rect width="760" height="316" rx="12" fill="var(--cds-page)"/><defs><marker id="tier-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Three tiers of Common Lisp, each unlocking a phase</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M248 134H266" marker-end="url(#tier-arrow)"></path><path d="M492 134H510" marker-end="url(#tier-arrow)"></path></g><g><rect x="24" y="56" width="224" height="156" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="40" y="80" font-weight="600" fill="var(--cds-text-primary)">Tier 0</text><text x="40" y="98" font-size="11.5" fill="var(--cds-text-primary)">Runs the compiler · phase 0</text><text x="40" y="122" font-size="11.5" fill="var(--cds-text-primary)">22 of 25 special operators</text><text x="40" y="140" font-size="11.5" fill="var(--cds-text-primary)">defmacro, full lambda lists</text><text x="40" y="158" font-size="11.5" fill="var(--cds-text-primary)">Fixnums, conses, symbols</text><text x="40" y="176" font-size="11.5" fill="var(--cds-text-primary)">Strings, vectors, hash tables</text><text x="40" y="194" font-size="11.5" fill="var(--cds-text-primary)">defstruct, error, handler-case</text></g><g><rect x="268" y="56" width="224" height="156" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="284" y="80" font-weight="600" fill="var(--cds-text-primary)">Tier 1</text><text x="284" y="98" font-size="11.5" fill="var(--cds-text-secondary)">Self-hosting core · phase 2</text><text x="284" y="122" font-size="11.5" fill="var(--cds-text-primary)">All 25 special operators</text><text x="284" y="140" font-size="11.5" fill="var(--cds-text-primary)">setf expanders, packages</text><text x="284" y="158" font-size="11.5" fill="var(--cds-text-primary)">Reader, printer, eval, load</text><text x="284" y="176" font-size="11.5" fill="var(--cds-text-primary)">Sequences, arrays, basic format</text><text x="284" y="194" font-size="11.5" fill="var(--cds-text-primary)">Floats, bignums, ratios</text></g><g><rect x="512" y="56" width="224" height="156" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="528" y="80" font-weight="600" fill="var(--cds-text-primary)">Tier 2</text><text x="528" y="98" font-size="11.5" fill="var(--cds-text-secondary)">Runs the environment · ph. 3–5</text><text x="528" y="122" font-size="11.5" fill="var(--cds-text-primary)">CLOS: generic functions</text><text x="528" y="140" font-size="11.5" fill="var(--cds-text-primary)">Live class redefinition</text><text x="528" y="158" font-size="11.5" fill="var(--cds-text-primary)">Conditions, restarts, debugger</text><text x="528" y="176" font-size="11.5" fill="var(--cds-text-primary)">loop, full format, streams</text><text x="528" y="194" font-size="11.5" fill="var(--cds-text-primary)">Pathnames over file hosts</text></g><g><rect x="24" y="236" width="712" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="40" y="260" font-weight="600" fill="var(--cds-text-primary)">Deferred until someone needs it</text><text x="40" y="279" font-size="11.5" fill="var(--cds-text-secondary)">Complex numbers, the full MOP, pretty-print dispatch, compile-file and fasls</text></g></svg>
