  svg { --cds-chart-axis: #8a8880; --cds-chart-grid: #353533; --cds-chart-categorical-1: #85b7eb;
    --cds-text-primary: #ecebe6; --cds-text-secondary: #b4b2a9; --cds-chart-reference-tint: #1c1c1b;
    --cds-surface: #222221; --cds-page: #161615; }
}
</style><rect width="760" height="440" rx="12" fill="var(--cds-page)"/><defs><marker id="disp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">HTML exists only inside the renderer</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M380 112V134" marker-end="url(#disp-arrow)"></path><path d="M380 192V214" marker-end="url(#disp-arrow)"></path><path d="M380 288V310" marker-end="url(#disp-arrow)"></path></g><g><rect x="24" y="56" width="712" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="80" font-weight="600" fill="var(--cds-text-primary)">Lisp UI code</text><text x="40" y="99" font-size="11.5" fill="var(--cds-text-secondary)">present, define-command, formatting-table, draw-circle* — CLIM-style, no tags or CSS</text></g><g><rect x="24" y="136" width="712" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="160" font-weight="600" fill="var(--cds-text-primary)">Output records</text><text x="40" y="179" font-size="11.5" fill="var(--cds-text-secondary)">A tree of Lisp objects: text runs, presentations, tables, drawings; redisplay diffs these</text></g><g><rect x="24" y="216" width="712" height="72" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="40" y="240" font-weight="600" fill="var(--cds-text-primary)">Display protocol</text><text x="40" y="259" font-size="11.5" fill="var(--cds-text-primary)">Semantic operations: insert, update or remove a record, batched per redisplay</text><text x="40" y="276" font-size="11.5" fill="var(--cds-text-primary)">The same stream whether the VM runs as WASM in the page or natively in Tauri</text></g><g><rect x="24" y="312" width="712" height="104" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="334" font-weight="600" fill="var(--cds-text-primary)">Renderer — JavaScript in the page</text></g><g><rect x="40" y="344" width="332" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="56" y="367" font-weight="600" fill="var(--cds-text-primary)">DOM</text><text x="56" y="386" font-size="11.5" fill="var(--cds-text-secondary)">Text, viewers, menus, inspectors</text></g><g><rect x="388" y="344" width="332" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="404" y="367" font-weight="600" fill="var(--cds-text-primary)">Canvas or SVG</text><text x="404" y="386" font-size="11.5" fill="var(--cds-text-secondary)">Diagrams, plots, graphics</text></g></svg>
