="11.5" fill="var(--cds-text-primary)">Saved with the image</text></g><g><rect x="206" y="216" width="166" height="100" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="none"></rect><text x="222" y="240" font-weight="600" fill="var(--cds-text-primary)">Browser storage</text><text x="222" y="260" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="var(--cds-text-secondary)">browser:/src/</text><text x="222" y="282" font-size="11.5" fill="var(--cds-text-primary)">OPFS, per origin</text><text x="222" y="300" font-size="11.5" fill="var(--cds-text-primary)">Survives page reloads</text></g><g><rect x="388" y="216" width="166" height="100" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="none"></rect><text x="404" y="240" font-weight="600" fill="var(--cds-text-primary)">Local disk</text><text x="404" y="260" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="var(--cds-text-secondary)">local:/src/</text><text x="404" y="282" font-size="11.5" fill="var(--cds-text-primary)">Native builds only</text><text x="404" y="300" font-size="11.5" fill="var(--cds-text-primary)">Git working trees</text></g><g><rect x="570" y="216" width="166" height="100" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="586" y="240" font-weight="600" fill="var(--cds-text-primary)">Remote (later)</text><text x="586" y="260" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="var(--cds-text-secondary)">cloud:/projects/</text><text x="586" y="282" font-size="11.5" fill="var(--cds-text-primary)">Any device, any build</text><text x="586" y="300" font-size="11.5" fill="var(--cds-text-primary)">Optional paid service</text></g></svg>
