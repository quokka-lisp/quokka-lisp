<!-- Drawn for docs/design.md; edit the SVG directly. -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="632" viewBox="0 0 760 632" role="img" aria-label="Seven phases to a system you can live in" font-size="13"><style>
svg { --cds-chart-axis: #9c9a92; --cds-chart-grid: #e2e0d8; --cds-chart-categorical-1: #378add;
  --cds-text-primary: #1f1f1d; --cds-text-secondary: #5f5e5a; --cds-chart-reference-tint: #f6f5f1;
  --cds-surface: #ffffff; --cds-page: #ffffff;
  font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
@media (prefers-color-scheme: dark) {
  svg { --cds-chart-axis: #8a8880; --cds-chart-grid: #353533; --cds-chart-categorical-1: #85b7eb;
    --cds-text-primary: #ecebe6; --cds-text-secondary: #b4b2a9; --cds-chart-reference-tint: #1c1c1b;
    --cds-surface: #222221; --cds-page: #161615; }
}
</style><rect width="760" height="632" rx="12" fill="var(--cds-page)"/><defs><marker id="road-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Seven phases to a system you can live in</text><text x="24" y="60" font-size="11.5" fill="var(--cds-text-secondary)">Phase</text><text x="500" y="60" font-size="11.5" fill="var(--cds-text-secondary)">Gate to pass before moving on</text><g><path d="M250 128V150" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#road-arrow)"></path><path d="M250 208V230" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#road-arrow)"></path><path d="M250 288V310" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#road-arrow)"></path><path d="M250 368V390" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#road-arrow)"></path><path d="M250 448V470" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#road-arrow)"></path><path d="M250 528V550" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#road-arrow)"></path></g><g><g><rect x="24" y="72" width="452" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><path d="M476 100H498" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="3 3"></path><polygon points="500,100 506,94 512,100 506,106" fill="var(--cds-chart-axis)"></polygon></g><text x="40" y="94" font-weight="600" fill="var(--cds-text-primary)">0 · Spike</text><text x="40" y="112" font-size="11.5" fill="var(--cds-text-secondary)">Tagged heap, reader and interpreter in Rust; native and WASM builds</text><text x="516" y="96" font-size="11.5" fill="var(--cds-text-primary)">(fact 20) runs; the GC survives</text><text x="516" y="112" font-size="11.5" fill="var(--cds-text-primary)">an allocation stress test</text></g><g><g><rect x="24" y="152" width="452" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><path d="M476 180H498" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="3 3"></path><polygon points="500,180 506,174 512,180 506,186" fill="var(--cds-chart-axis)"></polygon></g><text x="40" y="174" font-weight="600" fill="var(--cds-text-primary)">1 · Bytecode and image</text><text x="40" y="192" font-size="11.5" fill="var(--cds-text-secondary)">Bytecode VM; the interpreter runs the CL compiler to build the image</text><text x="516" y="176" font-size="11.5" fill="var(--cds-text-primary)">An image saves, reloads and</text><text x="516" y="192" font-size="11.5" fill="var(--cds-text-primary)">resumes where it left off</text></g><g><g><rect x="24" y="232" width="452" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><path d="M476 260H498" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="3 3"></path><polygon points="500,260 506,254 512,260 506,266" fill="var(--cds-chart-axis)"></polygon></g><text x="40" y="254" font-weight="600" fill="var(--cds-text-primary)">2 · Self-hosting</text><text x="40" y="272" font-size="11.5" fill="var(--cds-text-secondary)">The compiled compiler rebuilds itself and the core library</text><text x="516" y="256" font-size="11.5" fill="var(--cds-text-primary)">Rebuilt compiler matches the</text><text x="516" y="272" font-size="11.5" fill="var(--cds-text-primary)">first build byte for byte</text></g><g><g><rect x="24" y="312" width="452" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><path d="M476 340H498" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="3 3"></path><polygon points="500,340 506,334 512,340 506,346" fill="var(--cds-chart-axis)"></polygon></g><text x="40" y="334" font-weight="600" fill="var(--cds-text-primary)">3 · Conditions and processes</text><text x="40" y="352" font-size="11.5" fill="var(--cds-text-secondary)">Restarts, reified frames, green threads, a terminal debugger</text><text x="516" y="336" font-size="11.5" fill="var(--cds-text-primary)">Fix a function from inside an</text><text x="516" y="352" font-size="11.5" fill="var(--cds-text-primary)">error and retry the frame</text></g><g><g><rect x="24" y="392" width="452" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><path d="M476 420H498" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="3 3"></path><polygon points="500,420 506,414 512,420 506,426" fill="var(--cds-chart-axis)"></polygon></g><text x="40" y="414" font-weight="600" fill="var(--cds-text-primary)">4 · Renderer and live text</text><text x="40" y="432" font-size="11.5" fill="var(--cds-text-secondary)">Display protocol, browser renderer, one live-text viewer</text><text x="516" y="416" font-size="11.5" fill="var(--cds-text-primary)">Edit and evaluate a form</text><text x="516" y="432" font-size="11.5" fill="var(--cds-text-primary)">in the browser</text></g><g><g><rect x="24" y="472" width="452" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><path d="M476 500H498" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="3 3"></path><polygon points="500,500 506,494 512,500 506,506" fill="var(--cds-chart-axis)"></polygon></g><text x="40" y="494" font-weight="600" fill="var(--cds-text-primary)">5 · Presentations and inspector</text><text x="40" y="512" font-size="11.5" fill="var(--cds-text-secondary)">Presentation types, commands, a moldable inspector</text><text x="516" y="496" font-size="11.5" fill="var(--cds-text-primary)">Click a result to inspect it</text><text x="516" y="512" font-size="11.5" fill="var(--cds-text-primary)">or pass it to a command</text></g><g><g><rect x="24" y="552" width="452" height="56" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><path d="M476 580H498" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="3 3"></path><polygon points="500,580 506,574 512,580 506,586" fill="var(--cds-chart-axis)"></polygon></g><text x="40" y="574" font-weight="600" fill="var(--cds-text-primary)">6 · The environment</text><text x="40" y="592" font-size="11.5" fill="var(--cds-text-primary)">Tiled viewers and desktops, browser, debugger viewer, file sync</text><text x="516" y="576" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">Daily work on the system happens</text><text x="516" y="592" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">inside the system</text></g></svg>
