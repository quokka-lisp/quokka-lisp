0" fill="var(--cds-text-primary)">4</text><text x="56" y="342" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="var(--cds-text-primary)">(defun collect (heap) ...)</text><text x="56" y="364" font-size="11.5" fill="var(--cds-text-secondary)">Opened from the file object, not a path</text></g><g><g><rect x="504" y="72" width="216" height="308" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><line x1="504" y1="100" x2="720" y2="100" stroke="var(--cds-chart-grid)"></line></g><text x="520" y="91" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">Inspector: vm.lisp</text><text x="520" y="128" font-size="11.5" fill="var(--cds-text-primary)">type: file</text><text x="520" y="150" font-size="11.5" fill="var(--cds-text-primary)">path: ~/notes/vm.lisp</text><text x="520" y="172" font-size="11.5" fill="var(--cds-text-primary)">module: vm</text><text x="520" y="210" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">Views</text><circle cx="690" cy="206" r="9" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></circle><text x="690" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="var(--cds-text-primary)">5</text><rect x="520" y="222" width="52" height="22" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="546" y="237" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">Source</text><rect x="578" y="222" width="58" height="22" rx="6" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1"></rect><text x="607" y="237" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">Callers</text><rect x="642" y="222" width="62" height="22" rx="6" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1"></rect><text x="673" y="237" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">History</text><text x="520" y="274" font-size="11.5" fill="var(--cds-text-secondary)">Each object chooses</text><text x="520" y="290" font-size="11.5" fill="var(--cds-text-secondary)">its own views</text></g><g><circle cx="33" cy="420" r="9" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></circle><text x="33" y="424" text-anchor="middle" font-size="11" font-weight="600" fill="var(--cds-text-primary)">1</text><text x="50" y="424" fill="var(--cds-text-primary)">Any form in any text runs where it stands — from Oberon</text><circle cx="33" cy="442" r="9" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></circle><text x="33" y="446" text-anchor="middle" font-size="11" font-weight="600" fill="var(--cds-text-primary)">2</text><text x="50" y="446" fill="var(--cds-text-primary)">Results print as presentations that keep their object — from Genera</text><circle cx="33" cy="464" r="9" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></circle><text x="33" y="468" text-anchor="middle" font-size="11" font-weight="600" fill="var(--cds-text-primary)">3</text><text x="50" y="468" fill="var(--cds-text-primary)">The commands offered depend on the object’s type, via generic functions</text><circle cx="33" cy="486" r="9" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></circle><text x="33" y="490" text-anchor="middle" font-size="11" font-weight="600" fill="var(--cds-text-primary)">4</text><text x="50" y="490" fill="var(--cds-text-primary)">Open in editor receives the file object itself, not a path string</text><circle cx="33" cy="508" r="9" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></circle><text x="33" y="512" text-anchor="middle" font-size="11" font-weight="600" fill="var(--cds-text-primary)">5</text><text x="50" y="512" fill="var(--cds-text-primary)">Each object defines its own inspector views — from Glamorous Toolkit</text></g></svg>
